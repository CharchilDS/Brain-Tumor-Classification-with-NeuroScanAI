version: '3.8'

services:
  backend:
    build:
      context: ./mri-vision-lab-main/backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - MODEL_PATH=/app/brain_tumor_model.keras
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./mri-vision-lab-main
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "7860:80"
    depends_on:
      backend:
        condition: service_healthy
